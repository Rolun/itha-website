<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision of Velldenar — The Velldenar Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Raleway', sans-serif;
      background-image: url('../../assets/New_Background.png');
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      color: #d4c9b0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(8, 7, 14, 0.78);
      z-index: 0;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 24px;
      max-width: 600px;
    }
    .eyebrow {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: #e8d5a3;
      letter-spacing: 0.05em;
      line-height: 1.25;
      margin-bottom: 10px;
    }
    .gold-line { width: 60px; height: 2px; background: #c9a84c; margin: 22px auto; }
    p {
      font-size: 0.95rem;
      color: #6a5c44;
      line-height: 1.9;
      font-weight: 300;
      margin-bottom: 36px;
    }
    a.back {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: #8a7550;
      text-decoration: none;
      border-bottom: 1px solid #3a3222;
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    a.back:hover { color: #c9a84c; border-color: #c9a84c; }
  </style>
</head>
<body>
  <div class="content">
    <div class="eyebrow">The Velldenar Project</div>
    <h1>Vision of Velldenar</h1>
    <div class="gold-line"></div>
    <p>This page is coming soon. The vision behind Velldenar will be shared here.</p>
    <a class="back" href="/test-new-mainpage/">&larr; Back to Home</a>
  </div>
</body>
</html>
