<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harbringer of Velldenar — The Velldenar Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Raleway', sans-serif;
      background-image: url('../../assets/Background.png');
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      color: #d4c9b0;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(8, 7, 14, 0.85);
      z-index: 0;
      pointer-events: none;
    }

    .sidebar {
      position: relative;
      z-index: 2;
      width: 260px;
      flex-shrink: 0;
      background: rgba(10, 9, 16, 0.75);
      border-right: 1px solid #2a2738;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-top {
      padding: 24px 20px 20px;
      border-bottom: 1px solid #2a2738;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #6b5f3f;
      text-decoration: none;
      letter-spacing: 0.05em;
      margin-bottom: 18px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #c9a84c; }
    .back-link::before { content: '←'; }

    .sidebar-book-title {
      font-family: 'Cinzel', serif;
      font-size: 0.92rem;
      font-weight: 600;
      color: #e8d5a3;
      line-height: 1.5;
      letter-spacing: 0.04em;
    }

    .sidebar-label {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #c9a84c;
      padding: 18px 20px 10px;
    }

    .chapter-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 20px;
    }
    .chapter-list::-webkit-scrollbar { width: 4px; }
    .chapter-list::-webkit-scrollbar-track { background: transparent; }
    .chapter-list::-webkit-scrollbar-thumb { background: #2a2738; border-radius: 2px; }

    .chapter-item {
      display: block;
      padding: 11px 12px;
      border-radius: 6px;
      font-size: 0.83rem;
      color: #7a7060;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border: none;

    .sidebar-footer {

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const chapterData = {
      1: { title: "Chapter 1 — The Mirror In The Snow",      num: "Harbringer of Velldenar", artLeft: "../../assets/harbringer_chapter1_left_side.png",  artRight: "../../assets/harbringer_chapter1_right_side.png", audioSrc: "chapter1_audio.mp3", pages: 28 },
      2: { title: "Chapter 2 — The Cost of The Flame",       num: "Harbringer of Velldenar", artLeft: "../../assets/harbringer_chapter1_left_side.png",  artRight: "../../assets/harbringer_chapter1_right_side.png", audioSrc: "chapter2_audio.mp3", pages: 51 },
      3: { title: "Chapter 3 — The Weeping Forest",          num: "Harbringer of Velldenar", artLeft: "../../assets/harbringer_chapter3_left_side.png",  artRight: "../../assets/harbringer_chapter3_right_side.png", comingSoon: true },
      4: { title: "Chapter 4 — When Terror Meets Sorrow",    num: "Harbringer of Velldenar", artLeft: "../../assets/harbringer_chapter1_left_side.png",  artRight: "../../assets/harbringer_chapter1_right_side.png", comingSoon: true },
      5: { title: "Chapter 5 — Where Gold Turns To Ash",     num: "Harbringer of Velldenar", artLeft: "../../assets/harbringer_chapter1_left_side.png",  artRight: "../../assets/harbringer_chapter1_right_side.png", comingSoon: true },
      6: { title: "Chapter 6 — The Rise Of The Harbinger",   num: "Harbringer of Velldenar", artLeft: "../../assets/harbringer_chapter1_left_side.png",  artRight: "../../assets/harbringer_chapter1_right_side.png", comingSoon: true },
      7: { title: "Chapter 7 — Shadows Of The Past",         num: "Harbringer of Velldenar", artLeft: "../../assets/harbringer_chapter7_left_side.png",  artRight: "../../assets/harbringer_chapter7_right_side.png", comingSoon: true }
    };

    const pdfTextCache = {};

    async function extractPdfParagraphs(url) {
      if (pdfTextCache[url]) return pdfTextCache[url];

      const pdf = await pdfjsLib.getDocument(url).promise;
      const rawLines = [];
      const fontFreq = {};

      // Pass 1: collect all lines and track font usage by character count
      for (let pn = 1; pn <= pdf.numPages; pn++) {
        const page = await pdf.getPage(pn);
        const tc = await page.getTextContent();

        const lineGroups = [];
        for (const item of tc.items) {
          if (!item.str.trim()) continue;
          const y = item.transform[5];
          let group = lineGroups.find(g => Math.abs(g.y - y) < 3);
          if (!group) { group = { y, items: [] }; lineGroups.push(group); }
          group.items.push(item);
          fontFreq[item.fontName] = (fontFreq[item.fontName] || 0) + item.str.length;
        }

        lineGroups.sort((a, b) => b.y - a.y);
        for (const g of lineGroups) {
          const items = g.items.sort((a, b) => a.transform[4] - b.transform[4]);
          const txt = items.map(i => i.str).join('');
          if (!txt.trim()) continue;
          const fonts = [...new Set(items.map(i => i.fontName))];
          rawLines.push({ y: g.y, txt, fonts, pn });
        }
        rawLines.push({ pageBreak: true });
      }

      // Most-used font by character count = body (non-italic) font
      const bodyFont = Object.entries(fontFreq).sort((a, b) => b[1] - a[1])[0]?.[0];

      // Pass 2: build paragraphs; lines using only non-body fonts = italic
      const paragraphs = [];
      let cur = '';
      let curItalic = false;
      let prevY = null;

      for (const line of rawLines) {
        if (line.pageBreak) {
          if (cur.trim()) { paragraphs.push({ text: cur.trim(), italic: curItalic }); cur = ''; }
          prevY = null;
          continue;
        }

        const cleaned = line.txt.trim();
        if (/^\d+$/.test(cleaned)) continue;                                                              // page numbers
        if (cleaned.includes('©')) continue;                                                              // copyright watermarks
        if (cleaned === cleaned.toUpperCase() && /[A-Z]/.test(cleaned) && cleaned.length < 120) continue; // all-caps headers

        const lineItalic = bodyFont ? line.fonts.every(f => f !== bodyFont) : false;

        if (prevY !== null) {
          const gap = prevY - line.y;
          if (gap > 34) {
            if (cur.trim()) { paragraphs.push({ text: cur.trim(), italic: curItalic }); cur = ''; }
            curItalic = lineItalic;
          } else {
            if (cur.endsWith('-')) { cur = cur.slice(0, -1); } else { cur += ' '; }
          }
        } else {
          curItalic = lineItalic;
        }

        cur += line.txt;
        if (lineItalic) curItalic = true;
        prevY = line.y;
      }
      if (cur.trim()) paragraphs.push({ text: cur.trim(), italic: curItalic });

      pdfTextCache[url] = paragraphs;
      return paragraphs;
    }

    let currentView = 'story';
    let currentChapter = 1;

    function setView(view) {
      currentView = view;
      document.getElementById('pdf-view').style.display = view === 'pdf' ? 'block' : 'none';
      document.getElementById('story-view').style.display = view === 'story' ? 'block' : 'none';
      document.getElementById('btn-pdf').classList.toggle('active', view === 'pdf');
      document.getElementById('btn-story').classList.toggle('active', view === 'story');
      const showArt = view === 'story';
      document.getElementById('art-frame-left').style.display = showArt ? 'flex' : 'none';
      document.getElementById('art-frame-right').style.display = showArt ? 'flex' : 'none';
      if (view === 'pdf') document.querySelector('.main-header').classList.remove('header-hidden');
      document.getElementById('tts-controls').style.display = (view === 'story' && ttsAudio) ? 'flex' : 'none';
      if (view === 'pdf') ttsStop();
      const bar = document.getElementById('progress-bar');
      const counter = document.getElementById('page-counter');
      if (view !== 'story') { bar.classList.remove('visible'); counter.style.display = 'none'; }
      else if (bar.children.length > 0) { bar.classList.add('visible'); counter.style.display = 'block'; }
    }

    async function loadChapter(num) {
      ttsStop();
      currentChapter = num;
      const data = chapterData[num];
      ttsLoad(data.audioSrc || null);
      document.getElementById('chapter-title-display').textContent = data.title;
      document.getElementById('download-link').href = `chapter${num}.pdf`;
      document.getElementById('download-link').download = `Harbringer-of-Velldenar-${data.title}.pdf`;
      document.getElementById('pdf-view').src = `chapter${num}.pdf`;
      document.getElementById('art-img-left').src = data.artLeft || '';
      document.getElementById('art-img-right').src = data.artRight || '';
      document.querySelectorAll('.chapter-item').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.chapter) === num);
      });

      const container = document.getElementById('story-content-inner');
      const header = `
        <div class="story-chapter-num">${data.num}</div>
        <div class="story-chapter-title">${data.title}</div>
        <div class="story-divider"></div>
      `;
      const footer = `
        <div class="story-footer">
          &copy; 2026 The Velldenar Project — All rights reserved.<br>
          This story is protected under copyright. Unauthorized reproduction is prohibited.
        </div>
      `;

      document.getElementById('story-view').scrollTop = 0;
      buildProgressBar(data.pages || 0);

      if (data.comingSoon) {
        container.innerHTML = header + `
          <div class="chapter-pending">
            <p>This chapter is yet to come.</p>
            <p class="chapter-pending-sub">
              The story continues beyond this page.<br>
              Return when the next chapter is ready.
            </p>
            <span class="chapter-pending-rune">✦ ✦ ✦</span>
          </div>
        ` + footer;
        return;
      }

      container.innerHTML = header +
        '<div class="story-text"><p style="color:#4a4438;font-style:italic;font-size:0.9rem;">Loading chapter text…</p></div>';

      try {
        const paragraphs = await extractPdfParagraphs(`chapter${num}.pdf`);
        let textHtml = '<div class="story-text">';
        let firstBody = true;
        paragraphs.forEach(para => {
          if (para.italic) {
            textHtml += `<p class="context-note">${para.text}</p>`;
          } else {
            textHtml += `<p${firstBody ? ' class="drop-cap"' : ''}>${para.text}</p>`;
            firstBody = false;
          }
        });
        textHtml += '</div>';
        container.innerHTML = header + textHtml + footer;
      } catch (e) {
        container.innerHTML = header +
          '<div class="story-text"><p class="placeholder-note">Chapter text coming soon.</p></div>' + footer;
      }
    }

    const sidebarEl = document.getElementById('sidebar');
    const overlayEl = document.getElementById('sidebar-overlay');
    function closeSidebar() {
      sidebarEl.classList.remove('sidebar-open');
      overlayEl.classList.remove('active');
    }
    document.getElementById('menu-toggle').addEventListener('click', () => {
      sidebarEl.classList.toggle('sidebar-open');
      overlayEl.classList.toggle('active');
    });
    overlayEl.addEventListener('click', closeSidebar);

    document.querySelectorAll('.chapter-item').forEach(btn => {
      btn.addEventListener('click', () => {
        closeSidebar();
        loadChapter(parseInt(btn.dataset.chapter));
      });
    });

    // ── Progress bar ──
    function buildProgressBar(count) {
      const bar = document.getElementById('progress-bar');
      const counter = document.getElementById('page-counter');
      bar.innerHTML = '';
      bar.classList.remove('visible');
      counter.style.display = 'none';
      if (!count || currentView !== 'story') return;
      for (let i = 0; i < count; i++) {
        const seg = document.createElement('div');
        seg.className = 'progress-segment';
        bar.appendChild(seg);
      }
      bar.classList.add('visible');
      document.getElementById('page-total').textContent = count;
      document.getElementById('page-current').textContent = '1';
      counter.style.display = 'block';
    }

    function updateProgressBar() {
      const bar = document.getElementById('progress-bar');
      if (!bar.classList.contains('visible')) return;
      const sv = document.getElementById('story-view');
      const segments = bar.querySelectorAll('.progress-segment');
      const total = segments.length;
      if (!total) return;
      const max = sv.scrollHeight - sv.clientHeight;
      const progress = max > 0 ? sv.scrollTop / max : 0;
      const filled = Math.min(total, Math.round(progress * total));
      segments.forEach((seg, i) => seg.classList.toggle('filled', i < filled));
      document.getElementById('page-current').textContent = Math.max(1, filled || 1);
    }

    // Auto-hide header on scroll in Story View
    const headerEl = document.querySelector('.main-header');
    let lastScrollY = 0;
    document.getElementById('story-view').addEventListener('scroll', () => {
      updateProgressBar();
      if (currentView !== 'story') return;
      if (window.innerWidth <= 768) return;
      const sy = document.getElementById('story-view').scrollTop;
      if (sy > 80 && sy > lastScrollY) {
        headerEl.classList.add('header-hidden');
      } else if (sy < lastScrollY || sy < 80) {
        headerEl.classList.remove('header-hidden');
      }
      lastScrollY = sy;
    });

    // ── Text-to-Speech (pre-generated audio per chapter) ──
    let ttsReading = false;
    let ttsPaused = false;
    let ttsAudio = null;

    function ttsLoad(src) {
      if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
      ttsReading = false; ttsPaused = false;
      ttsUpdateUI();
      document.getElementById('tts-controls').style.display = 'none';
      if (!src) return;
      ttsAudio = new Audio(src);
      ttsAudio.onended = () => { ttsReading = false; ttsUpdateUI(); };
      if (currentView === 'story') document.getElementById('tts-controls').style.display = 'flex';
    }
    function ttsUpdateUI() {
      const btn = document.getElementById('tts-btn');
      const stop = document.getElementById('tts-stop-btn');
      if (!ttsReading) {
        btn.textContent = '\u25b6 Read Aloud';
        btn.classList.remove('reading');
      } else if (ttsPaused) {
        btn.textContent = '\u25b6 Resume';
        btn.classList.add('reading');
      } else {
        btn.textContent = '\u23f8 Pause';
        btn.classList.add('reading');
      }
      stop.style.display = ttsReading ? 'inline-flex' : 'none';
    }
    function ttsStop() {
      if (ttsAudio) { ttsAudio.pause(); ttsAudio.currentTime = 0; }
      ttsReading = false; ttsPaused = false;
      ttsUpdateUI();
    }
    function ttsTogglePause() {
      if (!ttsAudio) return;
      if (ttsPaused) { ttsAudio.play().catch(() => {}); ttsPaused = false; }
      else { ttsAudio.pause(); ttsPaused = true; }
      ttsUpdateUI();
    }
    function ttsStart() {
      if (!ttsAudio) return;
      ttsAudio.currentTime = 0;
      ttsReading = true; ttsPaused = false;
      ttsUpdateUI();
      ttsAudio.play().catch(() => { ttsReading = false; ttsUpdateUI(); });
    }
    document.getElementById('tts-btn').addEventListener('click', () => {
      if (!ttsReading) ttsStart(); else ttsTogglePause();
    });
    document.getElementById('tts-stop-btn').addEventListener('click', ttsStop);

    loadChapter(1);
    setView('story');
  </script>

</body>
</html>
